<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <rect width="600" height="380" fill="#1c1917" rx="16"/>
  <rect x="1" y="1" width="598" height="378" fill="none" stroke="rgba(217, 119, 6, 0.4)" stroke-width="2" rx="15"/>
  
  <!-- Header Bar -->
  <path d="M0 16 C0 7 7 0 16 0 L584 0 C593 0 600 7 600 16 L600 45 L0 45 Z" fill="#451a03"/>
  <circle cx="25" cy="22.5" r="5" fill="#ef4444"/>
  <circle cx="42" cy="22.5" r="5" fill="#f59e0b"/>
  <circle cx="59" cy="22.5" r="5" fill="#10b981"/>
  <rect x="90" y="10" width="420" height="25" rx="6" fill="#1c1917"/>
  <text x="300" y="27" font-family="'Fira Code', monospace" font-size="11" fill="#fbbf24" text-anchor="middle">Book Publishing Platform • Reader Portal UI</text>

  <!-- Book Showcase UI -->
  <g transform="translate(40, 75)">
    <!-- Book 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="140" height="200" rx="8" fill="#b45309"/>
      <rect x="10" y="10" width="120" height="180" rx="6" fill="#78350f" stroke="#fef3c7" stroke-width="2"/>
      <text x="70" y="60" font-family="sans-serif" font-weight="bold" font-size="16" fill="#fef3c7" text-anchor="middle">MODERN</text>
      <text x="70" y="80" font-family="sans-serif" font-weight="bold" font-size="14" fill="#fbbf24" text-anchor="middle">WEB DEV</text>
      <text x="70" y="150" font-family="sans-serif" font-size="10" fill="#fef3c7" text-anchor="middle">Edition 2026</text>
    </g>

    <!-- Book 2 -->
    <g transform="translate(180, 0)">
      <rect x="0" y="0" width="140" height="200" rx="8" fill="#1e3a8a"/>
      <rect x="10" y="10" width="120" height="180" rx="6" fill="#1e40af" stroke="#93c5fd" stroke-width="2"/>
      <text x="70" y="60" font-family="sans-serif" font-weight="bold" font-size="16" fill="#93c5fd" text-anchor="middle">MASTERING</text>
      <text x="70" y="80" font-family="sans-serif" font-weight="bold" font-size="14" fill="#60a5fa" text-anchor="middle">REACT.JS</text>
      <text x="70" y="150" font-family="sans-serif" font-size="10" fill="#93c5fd" text-anchor="middle">Best Seller</text>
    </g>

    <!-- Book 3 -->
    <g transform="translate(360, 0)">
      <rect x="0" y="0" width="140" height="200" rx="8" fill="#047857"/>
      <rect x="10" y="10" width="120" height="180" rx="6" fill="#065f46" stroke="#a7f3d0" stroke-width="2"/>
      <text x="70" y="60" font-family="sans-serif" font-weight="bold" font-size="16" fill="#a7f3d0" text-anchor="middle">UI & GSAP</text>
      <text x="70" y="80" font-family="sans-serif" font-weight="bold" font-size="14" fill="#34d399" text-anchor="middle">ANIMATION</text>
      <text x="70" y="150" font-family="sans-serif" font-size="10" fill="#a7f3d0" text-anchor="middle">Interactive</text>
    </g>
  </g>

  <!-- CTA Banner -->
  <g transform="translate(40, 300)">
    <rect x="0" y="0" width="520" height="40" rx="8" fill="#451a03" stroke="#f59e0b"/>
    <text x="260" y="25" font-family="sans-serif" font-weight="bold" font-size="13" fill="#fbbf24" text-anchor="middle">📖 Explore 500+ Digital Publications & Author Books</text>
  </g>
</svg>
