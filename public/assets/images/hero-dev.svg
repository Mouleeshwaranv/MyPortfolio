<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="grad-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Decorative Circles -->
  <circle cx="400" cy="400" r="320" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="2" stroke-dasharray="8 8"/>
  <circle cx="400" cy="400" r="240" fill="none" stroke="rgba(6, 182, 212, 0.2)" stroke-width="2"/>
  
  <!-- Glowing Hexagon Frame -->
  <polygon points="400,160 580,260 580,480 400,580 220,480 220,260" fill="rgba(18, 24, 36, 0.85)" stroke="url(#grad1)" stroke-width="4" filter="url(#glow)"/>

  <!-- Code Editor Window Frame -->
  <rect x="250" y="240" width="300" height="200" rx="12" fill="#0f172a" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <circle cx="270" cy="260" r="5" fill="#ef4444"/>
  <circle cx="285" cy="260" r="5" fill="#f59e0b"/>
  <circle cx="300" cy="260" r="5" fill="#10b981"/>

  <!-- Code Snippet Visual Lines -->
  <rect x="270" y="285" width="120" height="8" rx="4" fill="#38bdf8"/>
  <rect x="270" y="305" width="180" height="8" rx="4" fill="#818cf8"/>
  <rect x="290" y="325" width="140" height="8" rx="4" fill="#c084fc"/>
  <rect x="290" y="345" width="100" height="8" rx="4" fill="#34d399"/>
  <rect x="270" y="365" width="160" height="8" rx="4" fill="#f472b6"/>
  <rect x="270" y="385" width="90" height="8" rx="4" fill="#fbbf24"/>

  <!-- Developer Graphic Avatar Badge -->
  <g transform="translate(400, 520)">
    <rect x="-110" y="-25" width="220" height="50" rx="25" fill="rgba(6, 182, 212, 0.15)" stroke="#06b6d4" stroke-width="2"/>
    <text x="0" y="6" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="16" fill="#38bdf8" text-anchor="middle">&lt;Mouleeshwaran /&gt;</text>
  </g>

  <!-- Animated Floating Tech Badges -->
  <g transform="translate(180, 220)">
    <rect x="-40" y="-20" width="80" height="40" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="0" y="5" font-family="sans-serif" font-weight="bold" font-size="13" fill="#38bdf8" text-anchor="middle">React</text>
  </g>
  <g transform="translate(620, 240)">
    <rect x="-40" y="-20" width="80" height="40" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="0" y="5" font-family="sans-serif" font-weight="bold" font-size="13" fill="#818cf8" text-anchor="middle">GSAP</text>
  </g>
  <g transform="translate(600, 480)">
    <rect x="-45" y="-20" width="90" height="40" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <text x="0" y="5" font-family="sans-serif" font-weight="bold" font-size="13" fill="#34d399" text-anchor="middle">Tailwind</text>
  </g>
  <g transform="translate(200, 470)">
    <rect x="-40" y="-20" width="80" height="40" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="0" y="5" font-family="sans-serif" font-weight="bold" font-size="13" fill="#f59e0b" text-anchor="middle">JS ES6</text>
  </g>
</svg>
