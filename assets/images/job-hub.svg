<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <rect width="600" height="380" fill="#0b0f19" rx="16"/>
  <rect x="1" y="1" width="598" height="378" fill="none" stroke="rgba(99, 102, 241, 0.4)" stroke-width="2" rx="15"/>
  
  <!-- Header Bar -->
  <path d="M0 16 C0 7 7 0 16 0 L584 0 C593 0 600 7 600 16 L600 45 L0 45 Z" fill="#182234"/>
  <circle cx="25" cy="22.5" r="5" fill="#ef4444"/>
  <circle cx="42" cy="22.5" r="5" fill="#f59e0b"/>
  <circle cx="59" cy="22.5" r="5" fill="#10b981"/>
  <rect x="90" y="10" width="420" height="25" rx="6" fill="#0b0f19"/>
