<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <rect width="600" height="380" fill="#111827" rx="16"/>
  <rect x="1" y="1" width="598" height="378" fill="none" stroke="rgba(236, 72, 153, 0.4)" stroke-width="2" rx="15"/>
  
  <!-- Header Bar -->
  <path d="M0 16 C0 7 7 0 16 0 L584 0 C593 0 600 7 600 16 L600 45 L0 45 Z" fill="#831843"/>
  <circle cx="25" cy="22.5" r="5" fill="#ef4444"/>
  <circle cx="42" cy="22.5" r="5" fill="#f59e0b"/>
  <circle cx="59" cy="22.5" r="5" fill="#10b981"/>
  <rect x="90" y="10" width="420" height="25" rx="6" fill="#111827"/>
  <text x="300" y="27" font-family="'Fira Code', monospace" font-size="11" fill="#f472b6" text-anchor="middle">Mobile Shop Store • Interactive E-Commerce UI</text>

  <!-- Mobile Shop UI Grid -->
  <g transform="translate(30, 65)">
    <!-- Product 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="165" height="260" rx="12" fill="#1f2937" stroke="rgba(236, 72, 153, 0.3)"/>
      <rect x="25" y="20" width="115" height="110" rx="10" fill="#111827"/>
      <!-- Mobile Smartphone graphic -->
      <rect x="52" y="30" width="60" height="90" rx="8" fill="#374151" stroke="#ec4899" stroke-width="2"/>
      <rect x="58" y="38" width="48" height="70" rx="4" fill="#60a5fa"/>
      
      <text x="15" y="150" font-family="sans-serif" font-weight="bold" font-size="13" fill="#f9fafb">Pro Max 5G</text>
      <text x="15" y="170" font-family="sans-serif" font-weight="bold" font-size="15" fill="#f472b6">₹69,999</text>
      <rect x="15" y="195" width="135" height="35" rx="8" fill="#ec4899"/>
      <text x="82" y="217" font-family="sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">Add to Cart</text>
    </g>

    <!-- Product 2 -->
    <g transform="translate(185, 0)">
      <rect x="0" y="0" width="165" height="260" rx="12" fill="#1f2937"/>
      <rect x="25" y="20" width="115" height="110" rx="10" fill="#111827"/>
      <rect x="52" y="30" width="60" height="90" rx="8" fill="#374151" stroke="#8b5cf6" stroke-width="2"/>
      <rect x="58" y="38" width="48" height="70" rx="4" fill="#c084fc"/>
      
      <text x="15" y="150" font-family="sans-serif" font-weight="bold" font-size="13" fill="#f9fafb">Ultra Gaming Phone</text>
      <text x="15" y="170" font-family="sans-serif" font-weight="bold" font-size="15" fill="#a855f7">₹49,999</text>
      <rect x="15" y="195" width="135" height="35" rx="8" fill="#8b5cf6"/>
      <text x="82" y="217" font-family="sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">Add to Cart</text>
    </g>

    <!-- Product 3 -->
    <g transform="translate(370, 0)">
      <rect x="0" y="0" width="170" height="260" rx="12" fill="#1f2937"/>
      <rect x="25" y="20" width="120" height="110" rx="10" fill="#111827"/>
      <rect x="55" y="30" width="60" height="90" rx="8" fill="#374151" stroke="#06b6d4" stroke-width="2"/>
      <rect x="61" y="38" width="48" height="70" rx="4" fill="#38bdf8"/>
      
      <text x="15" y="150" font-family="sans-serif" font-weight="bold" font-size="13" fill="#f9fafb">Smart Edge Note</text>
      <text x="15" y="170" font-family="sans-serif" font-weight="bold" font-size="15" fill="#38bdf8">₹29,999</text>
      <rect x="15" y="195" width="140" height="35" rx="8" fill="#06b6d4"/>
      <text x="85" y="217" font-family="sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">Add to Cart</text>
    </g>
