<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <rect width="600" height="380" fill="#09131a" rx="16"/>
  <rect x="1" y="1" width="598" height="378" fill="none" stroke="rgba(245, 158, 11, 0.4)" stroke-width="2" rx="15"/>
  
  <!-- Header Bar -->
  <path d="M0 16 C0 7 7 0 16 0 L584 0 C593 0 600 7 600 16 L600 45 L0 45 Z" fill="#1c1917"/>
  <circle cx="25" cy="22.5" r="5" fill="#ef4444"/>
  <circle cx="42" cy="22.5" r="5" fill="#f59e0b"/>
  <circle cx="59" cy="22.5" r="5" fill="#10b981"/>
  <rect x="90" y="10" width="420" height="25" rx="6" fill="#09131a"/>
  <text x="300" y="27" font-family="'Fira Code', monospace" font-size="11" fill="#f59e0b" text-anchor="middle">https://where-is-my-bus-wheat.vercel.app</text>

  <!-- Live Bus Tracking Map Interface -->
  <g transform="translate(30, 65)">
    <!-- Map Canvas Container -->
    <rect x="0" y="0" width="540" height="280" rx="12" fill="#15232d"/>
    
    <!-- Map Roads Vector Lines -->
    <path d="M40 80 Q 200 40 300 140 T 500 220" fill="none" stroke="#2a3d4c" stroke-width="18"/>
    <path d="M120 260 L 180 30 L 420 180" fill="none" stroke="#2a3d4c" stroke-width="12"/>
    
    <!-- Active Bus Route Highlight -->
    <path d="M40 80 Q 200 40 300 140 T 360 170" fill="none" stroke="#f59e0b" stroke-width="6" stroke-dasharray="8 4"/>

    <!-- Moving Bus Pin Icon -->
    <g transform="translate(360, 170)">
      <circle cx="0" cy="0" r="22" fill="rgba(245, 158, 11, 0.3)"/>
      <circle cx="0" cy="0" r="14" fill="#f59e0b"/>
      <text x="0" y="5" font-family="sans-serif" font-weight="bold" font-size="12" fill="#1e293b" text-anchor="middle">🚌</text>
    </g>

    <!-- Floating Tracking Status Card -->
    <g transform="translate(20, 20)">
      <rect x="0" y="0" width="220" height="90" rx="10" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(245, 158, 11, 0.4)"/>
      <text x="15" y="25" font-family="sans-serif" font-weight="bold" font-size="13" fill="#fbbf24">Route 12B - Campus Express</text>
      <text x="15" y="45" font-family="sans-serif" font-size="11" fill="#94a3b8">Current Stop: College Gate</text>
      <text x="15" y="65" font-family="sans-serif" font-weight="bold" font-size="12" fill="#10b981">ETA: 4 mins away (Live)</text>
    </g>
  </g>
</svg>
